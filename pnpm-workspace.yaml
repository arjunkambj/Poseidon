packages:
  - "apps/*"
  - "packages/*"

# Keep every Effect RC piece on the catalog's version — a transitive
# resolution had pinned platform-node-shared@rc.115 against effect@rc.112,
# which broke imports (effect/ByteSize does not exist in rc.112).
overrides:
  "@effect/platform-node-shared": 4.0.0-rc.112

allowBuilds:
  electron: true
  esbuild: true
  electron-winstaller: false
  # Native msgpack accelerator pulled in by Effect's RPC stack. Left unbuilt so
  # a checkout never needs a C++ toolchain; msgpackr falls back to JavaScript.
  msgpackr-extract: false

# Install the arm64 and x64 variants of platform-specific optional packages
# for this OS, not only the host's. The desktop app is packaged for both
# architectures from one mac or Windows host, and each app carries the
# terminal's pty binary for its own arch (apps/desktop/scripts/native-modules.mjs).
supportedArchitectures:
  os: [current]
  cpu: [current, x64, arm64]

catalog:
  typescript: ^6.0.3
  "@types/node": ^26.2.0
  next-themes: ^0.4.6
  react: ^19.2.8
  react-dom: ^19.2.8
  sonner: ^2.0.7
  "@types/react": ^19.2.17
  "@types/react-dom": ^19.2.3
  tailwindcss: ^4.3.3
  # Effect 4 release candidate. All four move together; never bump one alone.
  effect: 4.0.0-rc.112
  "@effect/atom-react": 4.0.0-rc.112
  "@effect/platform-node": 4.0.0-rc.112
  "@effect/vitest": 4.0.0-rc.112
  vitest: 4.1.11
  tsx: ^4.23.13
  esbuild: ^0.28.2
  # Renderer timeline and diff rendering.
  "@legendapp/list": ^3.3.11
  "@pierre/diffs": ^1.4.2
  # The highlighter @pierre/diffs runs; the renderer reads its language list.
  shiki: ^4.4.3
  react-markdown: ^10.1.0
  remark-gfm: ^4.0.1
  # Dead-export audit.
  knip: ^6.35.1

# The Claude Agent SDK lists a native build of the Claude Code CLI per platform
# as optional dependencies, about 220MB in all. The Claude connector always
# passes the user's installed CLI as `pathToClaudeCodeExecutable`, so none of
# them is ever run.
ignoredOptionalDependencies:
  - "@anthropic-ai/claude-agent-sdk-darwin-arm64"
  - "@anthropic-ai/claude-agent-sdk-darwin-x64"
  - "@anthropic-ai/claude-agent-sdk-linux-arm64"
  - "@anthropic-ai/claude-agent-sdk-linux-arm64-musl"
  - "@anthropic-ai/claude-agent-sdk-linux-x64"
  - "@anthropic-ai/claude-agent-sdk-linux-x64-musl"
  - "@anthropic-ai/claude-agent-sdk-win32-arm64"
  - "@anthropic-ai/claude-agent-sdk-win32-x64"

minimumReleaseAgeExclude:
  - "@honeyicons/react@0.0.12"
